<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Text 'MR FI' in Deep Navy -->
  <text x="10" y="80" font-family="'Outfit', 'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="78" font-weight="900" font-style="italic" fill="#0c2340" letter-spacing="-1">MR FI</text>
  
  <!-- Stylized Red 'X' with integrated forward arrow -->
  <g transform="translate(255, 12)">
    <!-- Main Red X Body -->
    <path d="M 12 8 L 38 48 L 10 92 L 34 92 L 52 64 L 70 92 L 94 92 L 66 48 L 92 8 L 68 8 L 52 34 L 36 8 Z" fill="#e63946" />
    <!-- Center white/navy dynamic forward arrow cut -->
    <polygon points="12,50 48,50 48,40 68,52 48,64 48,54 12,54" fill="#ffffff" />
    <polygon points="46,42 64,52 46,62" fill="#e63946" />
  </g>

  <!-- Text 'ER' in Deep Navy -->
  <text x="355" y="80" font-family="'Outfit', 'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="78" font-weight="900" font-style="italic" fill="#0c2340" letter-spacing="-1">ER</text>

  <!-- Slogan -->
  <text x="18" y="116" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="16.5" font-weight="800" fill="#e63946" letter-spacing="7.5">WE FIX. YOU MOVE FORWARD.</text>
</svg>
